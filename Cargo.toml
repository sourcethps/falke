[workspace]
members = [".", "thps-rs", "thps-rs/crates/thug2", "thps-rs/crates/shared"]

[package]
name = "falke"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
thps-rs = { path = "thps-rs" }
retour = { git = "https://github.com/Hpmason/retour-rs.git", features = ["static-detour", "thiscall-abi"] }
thiserror = "1"
log = "0.4.17"
simplelog = "0.12.1"
anyhow = "1.0.98"
egui = "0.31.0"
egui-d3d9 = {path = "../egui-d3d9/egui-d3d9"}
nalgebra-glm = "0.20.0"
toy-arms = {git = "https://github.com/vxcall/toy-arms"}
[build-dependencies]
vergen = { version = "9.0.0", features = ["build"] }
vergen-git2 = "1.0.7"
vergen-lib = "0.1.6"
anyhow = "1.0.98"

[dependencies.egui_extras]
version = "0.31"
features = ["image", "all_loaders"]

[dependencies.windows]
version = "0.59"
features = [
	"Win32_Security",
	"Win32_UI_WindowsAndMessaging",
	"Win32_Graphics_Dxgi_Common",
	"Win32_Graphics_Direct3D9",
	"Win32_Graphics_Dxgi",
	"Win32_Graphics_Gdi",
	"Win32_System_Console",
	"Win32_Foundation",
	"Win32_System_LibraryLoader",
	"Win32_System_Threading",
]
